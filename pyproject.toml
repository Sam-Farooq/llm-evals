[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evals"
version = "0.4.0"
description = "Scorers, held-out suites and a guardrail chain for model output"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pandas>=2.2.0",
]

# Every provider is an extra. The scorers are pure and the test suite needs
# none of these, so the default install is two packages and no model weights.
[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
toxicity = ["transformers>=4.44.0", "torch>=2.4.0"]
tracing = ["langfuse>=2.50.0"]

[project.scripts]
llm-evals = "llm_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
